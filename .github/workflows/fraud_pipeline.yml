name: Credit Card Fraud Detection Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install imbalanced-learn scikit-learn

    - name: Authenticate via Python-generated Key File
      run: |
        python -c '
        import os, json
        raw_secret = """${{ secrets.GCP_CREDENTIALS }}"""
        # Đảm bảo parse và dump lại để JSON sạch sẽ, chuẩn cú pháp 100%
        parsed_json = json.loads(raw_secret)
        with open("gcp_key.json", "w", encoding="utf-8") as f:
            json.dump(parsed_json, f)
        '
        gcloud auth activate-service-account --key-file=gcp_key.json
        gcloud config set project frauddetection-507910
      env:
        PYTHONPATH: src
        
    - name: Run Fraud Detection Pipeline
      run: |
        python src/data_engineer.py
      env:
        PYTHONPATH: src
        # Trỏ thẳng đường dẫn đến file key vừa tạo bằng tay
        GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
