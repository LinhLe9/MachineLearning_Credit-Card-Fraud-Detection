name: Credit Card Fraud Detection Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Tự động chạy định kỳ mỗi giờ
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công trực tiếp từ giao diện GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create BigQuery Credentials from Secret
      run: |
        echo "${{ secrets.GCP_CREDENTIALS }}" > bigquery_credentials.json

    - name: Run Fraud Detection Pipeline
      run: |
        python src/data_engineer.py
      env:
        GOOGLE_APPLICATION_CREDENTIALS: bigquery_credentials.json
        PYTHONPATH: src